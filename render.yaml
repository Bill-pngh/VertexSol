services:
  # Backend Service (Node.js)
  - type: web
    name: vertexsol-backend
    runtime: node  # Changed from docker to node
    region: frankfurt
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
    buildCommand: npm install && npm run build
    startCommand: npm start  # Now valid with node runtime

  # Frontend Service (Static)
  - type: static  # Changed from web to static
    name: vertexsol-frontend
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    publishPath: ./dist  # Correct key for static sites
    envVars:
      - key: VITE_API_URL
        value: https://vertexsol-backend.onrender.com

databases:
  - name: vertexsol-db
    region: frankfurt
    plan: free
    databaseName: vertexsol_prod
