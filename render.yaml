services:
  # Backend Service (Node.js)
  - type: web
    name: vertexsol-backend
    runtime: node
    region: frankfurt
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
    buildCommand: npm install && npm run build
    startCommand: npm start

  # Frontend Service (Web with Docker)
  - type: web
    name: vertexsol-frontend
    runtime: docker
    region: frankfurt
    branch: main
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://vertexsol-backend.onrender.com

databases:
  - name: vertexsol-db
    region: frankfurt
    plan: free
    databaseName: vertexsol_prod
